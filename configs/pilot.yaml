data_root: Building_Dataset
output_root: outputs/pilot
seed: 42
inventory:
  city: Vegas
  rgb_bands: [1, 2, 3]
  annotation_crs: EPSG:4326
  pilot_tiles: 300
split:
  block_m: 500
  buffer_m: 30
  ratios: [0.6, 0.2, 0.2]
  # For multi-city experiments only; no additional downloads are performed.
  city_assignments: {}
normalization:
  # Fit per-channel percentiles on TRAIN ONLY; freeze before generating any exports.
  mode: train_percentile
  percentiles: [1, 99]
  max_tiles: 100
manipulation:
  edits: 120
  operations: [insertion, removal]
  dilation_px: 3
  blend_px: 2
  min_area_px: 20
  max_area_fraction: 0.15
  inpaint_radius: 3
  max_scale_ratio: 1.2
training:
  device: cpu
  amp: false
  epochs: 3
  batch_size: 4
  size: 128
  base_channels: 16
  model: rgb
  lr: 0.001
  max_steps: null
  threads: 2
evaluation:
  target_fpr: 0.05
  image_top_fraction: 0.01
  abstention_margin: 0.1
  robustness: [resize, jpeg, blur]
provenance:
  trust_policy: credentials/trusted.json
